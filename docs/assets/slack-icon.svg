<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- confetti dots -->
  <g opacity="0.85">
    <circle cx="80" cy="90" r="8" fill="#fde047"/>
    <circle cx="430" cy="100" r="7" fill="#60a5fa"/>
    <circle cx="70" cy="410" r="7" fill="#34d399"/>
    <circle cx="440" cy="400" r="8" fill="#f472b6"/>
  </g>

  <!-- sparkle stars -->
  <g fill="#fde68a">
    <path d="M400 70 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 z"/>
    <path d="M100 340 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
  </g>

  <!-- rocket, centered, blasting up and to the right -->
  <g transform="translate(256,275) rotate(-30) scale(2.7)">
    <!-- flame -->
    <path d="M-6 38 Q0 70 6 38 Q0 50 -6 38 Z" fill="url(#flame)"/>
    <!-- fins -->
    <path d="M-14 24 L-28 42 L-6 32 Z" fill="#fb7185"/>
    <path d="M14 24 L28 42 L6 32 Z" fill="#fb7185"/>
    <!-- body -->
    <path d="M0 -46 C16 -30 16 10 10 32 L-10 32 C-16 10 -16 -30 0 -46 Z" fill="#f8fafc"/>
    <!-- nose stripe -->
    <path d="M0 -46 C9 -36 11 -18 11 0 L-11 0 C-11 -18 -9 -36 0 -46 Z" fill="#f87171"/>
    <!-- window -->
    <circle cx="0" cy="4" r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2.5"/>
  </g>
</svg>
