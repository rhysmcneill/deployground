# Deployground bot chart. Single replica by design: state lives in Git, warnings in memory.

image:
  repository: ghcr.io/rhysmcneill/deployground # published by CI on release
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Name of an existing Secret whose keys are injected as environment variables. It must hold:
#   SLACK_BOT_TOKEN   (xoxb-...)
#   SLACK_APP_TOKEN   (xapp-..., connections:write)
# plus every token env var the config references, e.g. GITHUB_TOKEN_NONPROD, GITHUB_TOKEN_PROD,
# DG_WEBHOOK_TOKEN (statusSource.secretRef) or ARGOCD_TOKEN (statusSource.tokenRef).
existingSecret: deployground-secrets

# Non-secret environment variables, e.g. DG_DEFAULT_CHANNEL. Do not use the DEPLOYGROUND_
# prefix here: the config loader treats it as a config override.
env:
  DG_DEFAULT_CHANNEL: ""
  DG_WEBHOOK_PORT: "8080"

# Status webhook Service (Argo CD Notifications posts here). The bootstrap ConfigMap assumes
# http://deployground.<namespace>.svc.cluster.local, i.e. port 80.
service:
  port: 80

# Rendered to a ConfigMap and mounted as the --config file. See examples/config.yaml
# for a full example, or pass one with: helm install ... -f my-values.yaml
config:
  git:
    provider: github
    repos: {}
  deployTarget:
    type: applicationset
    repo: ""
    pathTemplate: "{env}/{stack}/{component}/config.yaml"
  environments: {}
  stacks: {}
  capabilities: {}
  access:
    rules: []
  statusSource:
    type: argocd-notifications
    webhookPath: /argocd/notifications
  lifecycle:
    warnBefore: 1h
    reaperInterval: 1m
    maxLivePerUser: 10

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

# Automatically applies the generated ApplicationSet(s) ONLY on every sync, via a dedicated
# PreSync hook Job whose own narrowly-scoped ServiceAccount can only create/update
# ApplicationSets in argocdNamespace below. The bot's OWN pod is never granted this — it
# still only ever opens PRs. argocd-notifications-cm is deliberately NEVER auto-applied: it's
# typically already owned by however ArgoCD itself is installed (e.g. the argo-cd Helm
# chart's own `notifications:` values), and auto-applying it would get silently reverted on
# that install's next upgrade — merge it into that install's own config by hand, once; see
# docs/quickstart.md. Off by default: review the printed ApplicationSet by hand at least once
# (`deployground bootstrap --config ...`) before turning this on, since enabling it means no
# human reviews it before each apply.
bootstrap:
  enabled: false
  argocdNamespace: argocd
  # bitnami/kubectl no longer publishes pinned version tags on Docker Hub (only `latest`,
  # as of Bitnami's 2025 legacy-image policy change) — alpine/k8s is maintained and still
  # publishes a tag per Kubernetes version.
  kubectlImage: "alpine/k8s:1.31.3"
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
