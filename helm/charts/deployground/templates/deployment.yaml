apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: deployground
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1 # single replica by design (in-memory index and warnings)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deployground
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployground
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Kubernetes injects a SERVICE_HOST/PORT env var per Service in this namespace,
      # including this release's own Service (deployground-production-homelab), prefixed
      # "DEPLOYGROUND_..." — which collides with the config loader's DEPLOYGROUND_ env
      # override convention and fails config validation (extra_forbidden). Disabled since
      # nothing here relies on them.
      enableServiceLinks: false
      containers:
        - name: deployground
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "deployground"]
          args: ["--config", "/etc/deployground/config.yaml"]
          ports:
            - name: webhook
              containerPort: {{ .Values.env.DG_WEBHOOK_PORT | int }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          volumeMounts:
            - name: config
              mountPath: /etc/deployground
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
