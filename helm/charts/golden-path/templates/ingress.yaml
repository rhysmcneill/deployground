{{- if and .Values.port .Values.ingressHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  # Numeric, not the "http" port name: this cluster's Tailscale ingress
                  # operator doesn't resolve a named port against the Service and reports
                  # "no valid backends" instead.
                  number: {{ .Values.port }}
  {{- if eq .Values.ingressClassName "tailscale" }}
  # Tailscale's own ingress operator needs the host listed here (it provisions its own
  # cert for it) -- without this it rejects the rule's host outright as "unsupported".
  # No secretName: Tailscale issues the cert itself. Scoped to ingressClassName ==
  # "tailscale" specifically: a bare tls.hosts entry with no secretName is Tailscale's
  # own convention, not a general one -- on nginx/ALB/GKE it would just warn about a
  # missing secret, or conflict with their own managed-cert annotations, for no benefit.
  tls:
    - hosts:
        - {{ .Values.ingressHost | quote }}
  {{- end }}
{{- end }}
