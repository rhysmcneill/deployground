# Create the app via: api.slack.com/apps -> Create New App -> From an app manifest.
# Socket Mode is on, so there is no request URL, signing secret or event endpoint.
display_information:
  name: Deployground
  description: Self-service deploys from Slack, driven by GitOps.
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Deployground
    always_online: true
  shortcuts:
    - name: New deployment
      type: global
      callback_id: open_deploy_form # must match the handler registered by the bot
      description: Open the deployment form
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - usergroups:read
      - users:read
      - users:read.email
      - im:write
      - channels:read
      - groups:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
