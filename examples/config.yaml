# Example Deployground configuration (homelab-ish). Replace the placeholder names.
# Secrets are never inlined: only the NAMES of env vars that hold them.
git:
  provider: github
  repos:
    gitops-nonprod:
      owner: my-org
      name: gitops-nonprod
      branch: main
      authRef: { tokenEnv: GITHUB_TOKEN_NONPROD }
    gitops-prod:
      owner: my-org
      name: gitops-prod
      branch: main
      authRef: { tokenEnv: GITHUB_TOKEN_PROD }

deployTarget:
  type: applicationset # or: application
  repo: gitops-nonprod # which configured repo holds the component files
  pathTemplate: "{env}/{stack}/{component}/config.yaml"
  # Optional: where the workload chart comes from. Fully optional — omitting this entirely
  # uses the default below (the published golden-path chart, pinned to this bot's own
  # version). Uncomment to override:
  # workloadChart:
  #   type: oci # or: git
  #   repo: ghcr.io/rhysmcneill # oci: registry/org (chart name is appended)
  #   chart: golden-path-chart
  #   version: null # oci: targetRevision; null -> this bot's own version
  #   gitRepo: https://github.com/my-org/my-charts.git # git: full chart repo URL
  #   gitRef: main # git: targetRevision
  #   chartPath: charts/my-workload # git: path to the chart within gitRepo

environments:
  homelab:
    # Either a server URL (targets that cluster directly; use
    # https://kubernetes.default.svc for the cluster Argo CD itself runs in -- no Argo CD
    # Cluster registration needed, so most single-cluster setups just use this) or a
    # cluster *name* as registered in Argo CD (for teams managing several clusters from
    # one Argo CD).
    cluster: https://kubernetes.default.svc
    repo: gitops-nonprod
    autoMerge: true
    ttl: { default: 24h, max: 168h }
    requiresApproval: false
  prod:
    cluster: prod
    repo: gitops-prod
    autoMerge: false
    ttl: { default: none }
    requiresApproval: true

# Catalog: reusable component definitions. Each entry is a named set of components (image,
# default version, port, ...) that a user picks as "Catalog" in the deploy form. The entry's
# name is NOT the name of a live deployment: each deploy also gets its own "Stack name" (typed
# in the form), which becomes that deploy's namespace and URL.
catalog:
  api:
    components:
      api: { image: ghcr.io/my-org/api, defaultVersion: v1.2.3, port: 8080 }
  my-etire-stack:
    components:
      api: { image: ghcr.io/my-org/api, defaultVersion: v1.2.3, port: 8080 }
      web:
        image: ghcr.io/my-org/web
        defaultVersion: v4.5.6
        port: 3000
        # Neither set: private, no Ingress. ingressClassName alone (e.g. "tailscale")
        # defaults the host to the bare stack name -- no ingressHost needed.
        # ingressClassName: tailscale
        # ingressHost spells out a real host; {stack} keeps multi-deploy stacks collision-free.
        ingressHost: "{stack}.apps.home.example.com"
        # Optional: names of pre-existing dockerconfigjson Secrets (e.g. `kubectl create
        # secret docker-registry ...`) so kubelet can pull this image from a private
        # registry (Harbor, private ECR, private ghcr, etc.):
        # imagePullSecrets: [harbor-pull]
        # Optional: a pre-existing ServiceAccount (e.g. annotated `eks.amazonaws.com/role-arn`
        # for IRSA) the pod runs under, so the workload's own code can call AWS APIs at
        # runtime. This does NOT help pull private images — that's imagePullSecrets above:
        # serviceAccountName: my-irsa-sa
      worker:
        image: ghcr.io/my-org/worker
        defaultVersion: v2.0.0
        # A background worker: no port/ingress, but it still reads config and needs a
        # private-registry pull secret and plain env vars.
        env: { QUEUE_NAME: jobs, LOG_LEVEL: info }
        secretRefs: [worker-env] # names of pre-existing Secrets injected with envFrom
  custom-chart-example:
    components:
      # A component can point at its own Helm chart instead of the built-in golden-path
      # chart -- e.g. when the service already ships a chart of its own. `imageRef` tells
      # deployground where the image repo lives inside `values`, so allowedRegistries keeps
      # enforcing the same guardrail it does for golden-path's typed `image` field above.
      myservice:
        chart:
          type: oci # or: git -- see myservice-git below for that shape
          repo: ghcr.io/my-org
          chart: myservice-chart
          version: "1.4.0"
        values:
          image: { repository: ghcr.io/my-org/myservice, tag: v1.0.0 }
          replicas: 2
        imageRef: { path: image.repository }
        overridable:
          - { path: image.tag, label: "Version" }
          - { path: chart.version, label: "Chart version" }
          - { path: replicas, label: "Replicas" }
      # The git-chart shape, plus `ingressRef` -- the custom-chart equivalent of
      # golden-path's typed `ingressHost`, so ingressDomains can still enforce on a chart
      # that renders its own Ingress from somewhere inside `values`. For a git-type chart,
      # `chart.version` resolves to the chart's `gitRef` (its own `version` field is unused).
      myservice-git:
        chart:
          type: git
          gitRepo: https://github.com/my-org/myservice-chart.git
          gitRef: main # the "chart version" a git-type chart exposes as overridable
          chartPath: charts/myservice
        values:
          image: { repository: ghcr.io/my-org/myservice, tag: v1.0.0 }
          # No {stack} substitution here -- that's a golden-path-only convenience on the
          # typed ingressHost field. A custom chart's values are used exactly as written
          # (plus any operator-submitted override), so a per-stack host needs its own
          # overridable entry if you want deployers to set it per deploy.
          ingress: { host: myservice-git.apps.home.example.com }
        imageRef: { path: image.repository }
        ingressRef: { path: ingress.host }
        overridable:
          - { path: image.tag, label: "Version" }
          - { path: chart.version, label: "Chart ref" }

capabilities:
  image-deploy:
    enabled: true
    allowedRegistries: ["ghcr.io/my-org"]
    ingressDomains: ["home.example.com"]

# Default deny. Slack IDs: S... usergroup, C... channel, U... user.
access:
  rules:
    - { group: S012ADMIN, environments: ["*"], admin: true }
    - { channel: C0DEPLOY, environments: [homelab] }
    - { user: U012ABC, environments: ["*"] }
    - { group: S0PRODTEAM, environments: [prod] }

statusSource:
  type: argocd-notifications # or: argocd-api (pull; see docs/quickstart.md)
  webhookPath: /argocd/notifications
  # Base URL (no path) Argo CD uses to reach the bot; defaults to the in-cluster Service DNS.
  # Use an ingress URL if Argo CD runs in a different cluster.
  # webhookUrl: http://deployground.deployground.svc.cluster.local
  # Optional shared secret: the bot requires the X-Deployground-Token header to match
  # the value of this env var.
  secretRef: { tokenEnv: DG_WEBHOOK_TOKEN }
  # argocd-api alternative:
  #   type: argocd-api
  #   url: https://argocd.example.com
  #   tokenRef: { tokenEnv: ARGOCD_TOKEN }
  #   pollInterval: 15s

lifecycle: { warnBefore: 1h, reaperInterval: 1m, maxLivePerUser: 10 }
