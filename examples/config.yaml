# Example Deployground configuration (homelab-ish). Replace the placeholder names.
# Secrets are never inlined: only the NAMES of env vars that hold them.
git:
  provider: github
  repos:
    gitops-nonprod:
      owner: my-org
      name: gitops-nonprod
      branch: main
      authRef: { tokenEnv: GITHUB_TOKEN_NONPROD }
    gitops-prod:
      owner: my-org
      name: gitops-prod
      branch: main
      authRef: { tokenEnv: GITHUB_TOKEN_PROD }

deployTarget:
  type: applicationset # or: application
  repo: gitops-nonprod # which configured repo holds the component files
  pathTemplate: "{env}/{stack}/{component}/config.yaml"
  # Optional: override the default workload chart (published golden-path-chart). Uncomment:
  # workloadChart:
  #   type: oci # or: git
  #   repo: ghcr.io/rhysmcneill
  #   chart: golden-path-chart
  #   version: null # null -> this bot's own version
  #   gitRepo: https://github.com/my-org/my-charts.git
  #   gitRef: main
  #   chartPath: charts/my-workload

environments:
  homelab:
    # A server URL (no Argo CD Cluster registration needed) or a registered cluster name.
    cluster: https://kubernetes.default.svc
    repo: gitops-nonprod
    autoMerge: true
    ttl: { default: 24h, max: 168h }
    requiresApproval: false
  prod:
    cluster: prod
    repo: gitops-prod
    autoMerge: false
    ttl: { default: none }
    requiresApproval: true

# Reusable component sets a user picks as "Catalog" in the deploy form. Not the deployment's
# name -- each deploy also gets its own "Stack name", which becomes the namespace/URL.
catalog:
  api:
    components:
      api: { image: ghcr.io/my-org/api, defaultVersion: v1.2.3, port: 8080 }
  my-etire-stack:
    components:
      api: { image: ghcr.io/my-org/api, defaultVersion: v1.2.3, port: 8080 }
      web:
        image: ghcr.io/my-org/web
        defaultVersion: v4.5.6
        port: 3000
        ingressHost: "{stack}.apps.home.example.com" # {stack} keeps multi-deploy stacks unique
        # imagePullSecrets: [harbor-pull] # pre-existing dockerconfigjson Secrets, for private images
        # serviceAccountName: my-irsa-sa # pre-existing ServiceAccount the pod runs under (e.g. IRSA)
      admin:
        image: ghcr.io/my-org/admin
        defaultVersion: v1.0.0
        port: 9000
        ingressClassName: tailscale # no ingressHost -> host defaults to the bare stack name
      worker:
        image: ghcr.io/my-org/worker
        defaultVersion: v2.0.0
        env: { QUEUE_NAME: jobs, LOG_LEVEL: info }
        secretRefs: [worker-env] # pre-existing Secrets injected with envFrom; no port/ingress
  custom-chart-example:
    components:
      # A custom chart instead of golden-path. imageRef points allowedRegistries at the
      # image inside `values`, same guardrail golden-path's typed `image` field gets.
      myservice:
        chart:
          type: oci # or: git -- see myservice-git below for that shape
          repo: ghcr.io/my-org
          chart: myservice-chart
          version: "1.4.0"
        values:
          image: { repository: ghcr.io/my-org/myservice, tag: v1.0.0 }
          replicas: 2
        imageRef: { path: image.repository }
        overridable:
          - { path: image.tag, label: "Version" }
          - { path: chart.version, label: "Chart version" }
          - { path: replicas, label: "Replicas" }
      # git-type chart, plus ingressRef (the custom-chart equivalent of ingressHost).
      # chart.version resolves to gitRef here, not version.
      myservice-git:
        chart:
          type: git
          gitRepo: https://github.com/my-org/myservice-chart.git
          gitRef: main
          chartPath: charts/myservice
        values:
          image: { repository: ghcr.io/my-org/myservice, tag: v1.0.0 }
          # unlike ingressHost, custom-chart values get no {stack} substitution
          ingress: { host: myservice-git.apps.home.example.com }
        imageRef: { path: image.repository }
        ingressRef: { path: ingress.host }
        overridable:
          - { path: image.tag, label: "Version" }
          - { path: chart.version, label: "Chart ref" }

capabilities:
  image-deploy:
    enabled: true
    allowedRegistries: ["ghcr.io/my-org"]
    ingressDomains: ["home.example.com"]

# Default deny. Slack IDs: S... usergroup, C... channel, U... user.
access:
  rules:
    - { group: S012ADMIN, environments: ["*"], admin: true }
    - { channel: C0DEPLOY, environments: [homelab] }
    - { user: U012ABC, environments: ["*"] }
    - { group: S0PRODTEAM, environments: [prod] }

statusSource:
  type: argocd-notifications # or: argocd-api (pull; see docs/quickstart.md)
  webhookPath: /argocd/notifications
  # webhookUrl: http://deployground.deployground.svc.cluster.local # default; set if Argo CD is elsewhere
  secretRef: { tokenEnv: DG_WEBHOOK_TOKEN } # requires X-Deployground-Token to match this env var
  # argocd-api alternative:
  #   type: argocd-api
  #   url: https://argocd.example.com
  #   tokenRef: { tokenEnv: ARGOCD_TOKEN }
  #   pollInterval: 15s

lifecycle: { warnBefore: 1h, reaperInterval: 1m, maxLivePerUser: 10 }
