name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Bot release tag to build and publish the image for (e.g. v0.1.0)'
        required: true
      chart_version:
        description: 'golden-path chart version to package and push (e.g. 0.1.0); leave empty to skip'
        required: false
      bot_chart_version:
        description: 'deployground-chart version to package and push (e.g. 0.1.0); leave empty to skip'
        required: false

permissions: read-all

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      # Root "deployground" package (the bot itself) — release-please-action gives the root
      # path unprefixed output names.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # "golden-path" chart package — a non-root path, so its outputs are prefixed
      # "<path>--<name>" by the action (bracket access needed: the path contains "/").
      # Its version can differ from the bot's even though linked-versions releases both
      # together, so every consumer of this chart's version MUST read these, never the
      # root outputs above.
      chart_release_created: ${{ steps.release.outputs['helm/charts/golden-path--release_created'] }}
      chart_version: ${{ steps.release.outputs['helm/charts/golden-path--version'] }}
      chart_tag_name: ${{ steps.release.outputs['helm/charts/golden-path--tag_name'] }}
      # "deployground-chart" package (the bot's own Helm chart) — same non-root rule applies.
      bot_chart_release_created: ${{ steps.release.outputs['helm/charts/deployground--release_created'] }}
      bot_chart_version: ${{ steps.release.outputs['helm/charts/deployground--version'] }}
      bot_chart_tag_name: ${{ steps.release.outputs['helm/charts/deployground--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: tools/release/release-please-config.json
          manifest-file: tools/release/.release-please-manifest.json

  build-and-push:
    name: Build and Push Image
    needs: release-please
    if: |
      github.repository == 'rhysmcneill/deployground' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '')
      )
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}

      - name: Derive version from release tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          test -n "$TAG"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/rhysmcneill/deployground
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  publish-chart:
    name: Publish golden-path chart
    needs: release-please
    if: |
      github.repository == 'rhysmcneill/deployground' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.chart_version != '') ||
        (needs.release-please.outputs.chart_release_created == 'true' && needs.release-please.outputs.chart_version != '')
      )
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Automated: the chart's OWN release tag (its version can differ from the bot's,
          # even though linked-versions releases both in the same run — see release-please
          # job outputs above). Manual: whatever ref this workflow_dispatch run targets.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.release-please.outputs.chart_tag_name }}

      - name: Derive chart version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.chart_version }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.chart_version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$RELEASE_VERSION}"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify helm is available
        run: helm version

      - name: Package golden-path chart
        run: |
          helm package helm/charts/golden-path \
            --version "${{ steps.version.outputs.VERSION }}" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --destination .

      - name: Log in to ghcr.io (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart to ghcr.io
        # Chart.yaml's internal name is "golden-path-chart" (not "golden-path"), so the
        # packaged tgz is named accordingly and this resolves to
        # ghcr.io/rhysmcneill/golden-path-chart.
        run: helm push "golden-path-chart-${{ steps.version.outputs.VERSION }}.tgz" oci://ghcr.io/rhysmcneill

  publish-bot-chart:
    name: Publish deployground chart
    needs: release-please
    if: |
      github.repository == 'rhysmcneill/deployground' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.bot_chart_version != '') ||
        (needs.release-please.outputs.bot_chart_release_created == 'true' && needs.release-please.outputs.bot_chart_version != '')
      )
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.release-please.outputs.bot_chart_tag_name }}

      - name: Derive chart version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.bot_chart_version }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.bot_chart_version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$RELEASE_VERSION}"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify helm is available
        run: helm version

      - name: Package deployground chart
        run: |
          helm package helm/charts/deployground \
            --version "${{ steps.version.outputs.VERSION }}" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --destination .

      - name: Log in to ghcr.io (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart to ghcr.io
        # Chart.yaml's internal name is "deployground-chart" (not "deployground") so this
        # resolves to ghcr.io/rhysmcneill/deployground-chart — distinct from the container
        # image at ghcr.io/rhysmcneill/deployground. Same OCI org, different artifact name;
        # pushing both under the literal "deployground" path would collide.
        run: helm push "deployground-chart-${{ steps.version.outputs.VERSION }}.tgz" oci://ghcr.io/rhysmcneill
