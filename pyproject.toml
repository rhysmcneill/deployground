[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deployground"
version = "0.6.2"
description = "Self-service deploys for apps and infra, from the tools your team already uses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "slack-bolt",
    "pydantic>=2",
    "ghapi",
    "httpx",
    "PyYAML",
    "uvicorn",
]

[project.scripts]
deployground = "deployground.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
